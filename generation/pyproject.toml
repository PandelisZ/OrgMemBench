[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-corpus"
version = "0.0.1"
description = "Helix benchmark — corpus generation pipeline (Stages A-F). Single-LLM (gpt-oss:20b, via any OpenAI-compatible endpoint) generation of company canon, source-of-truth graph, noisy corpus, and questions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2",
    # graphify_service provides the OpenAICompatClient transport we extend
    # with reasoning_effort + structured-text helpers.
    "graphify-service",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
helix-corpus = "helix_corpus.cli:main"

[tool.setuptools]
packages = ["helix_corpus", "helix_corpus.pipeline"]

[tool.setuptools.package-data]
helix_corpus = ["prompts/**/*.md", "prompts/**/*.txt"]
